name: Build and Publish Executables

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os-name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: Windows
            runner: windows-latest
            rid: win-x64
            ext: .exe
          - os-name: macOS (Intel)
            runner: macos-13
            rid: osx-x64
            ext: ""
          - os-name: macOS (Apple Silicon)
            runner: macos-latest
            rid: osx-arm64
            ext: ""
          - os-name: Linux
            runner: ubuntu-latest
            rid: linux-x64
            ext: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Find Project and Pull Dependencies
        shell: bash
        run: |
          # 1. Dynamically find the .csproj file wherever it is in the repository
          PROJECT_FILE=$(find . -name "*.csproj" | head -n 1)
          echo "Found project file at: $PROJECT_FILE"
          
          # 2. Force restore from NuGet.org to pull Avalonia, QuestPDF, etc.
          dotnet restore "$PROJECT_FILE" --source https://api.nuget.org/v3/index.json

      - name: Publish Executable
        shell: bash
        run: |
          # Re-grab the project file path for the publish command
          PROJECT_FILE=$(find . -name "*.csproj" | head -n 1)
          
          # 3. Compile the standalone binary
          dotnet publish "$PROJECT_FILE" -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o publish/${{ matrix.rid }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DadPlanner2-${{ matrix.os-name }}
          path: publish/${{ matrix.rid }}/DadPlanner2${{ matrix.ext }}
          retention-days: 5
